# nội dung chính Một thay đổi được tái tạo bằng 3 kiểu, gắn vào một định vị. Release「epub-latest」Trên, liên kết tải xuống không thay đổi：
#   EPUB        https://github.com/eternity4719/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.epub
#   PDF         https://github.com/eternity4719/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.pdf
#   Dữ liệu đơn ngoại tuyến  https://github.com/eternity4719/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.html
# PR Chỉ tạo và kiểm tra, không phát hành, sản phẩm là Actions Trang artifact Trò chơi。
name: Sách điện tử

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # kiểm tra tham chiếu chéo 。 Một cá nhân job，Không treo build R: Không cần phải bận rộn EPUB、PDF và
  # Việc phát hành tài liệu độc lập offline là hai điều.。PR Màu đỏ như trên.，main Những gì có thể được gửi ra ngoài。
  # Liên kết địa phương（sync-stats.mjs）Hãy nhớ để chạy.，
  # Bên ngoài PR Tuy nhiên, điều này không thể được thực hiện hoàn toàn, vì vậy việc kiểm tra được thực hiện ở CI Có một trong số đó. 0 phụ thuộc, vài giây。
  refs:
    name: Kiểm tra tham chiếu chéo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # kiểm tra cách diễn đạt dễ hiểu Đường dài, nghiên cứu ngôn ngữ, nói trừu tượng. Những lý do giống nhau, một cách riêng biệt job，Báo cáo。
  plain:
    name: Kiểm tra diễn đạt dễ hiểu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # kiểm tra số liệu thống kê：README、index.html、og.html Lilly mục Số lượng、A/B/C số, số liên kết, etc. book/ Được rồi.。
  # địa phương sync-stats.mjs Hãy nhớ rằng chạy mới được cập nhật, kết hợp trực tiếp trên trang web. PR Không thể vượt qua được nó. Những lý do tương tự, không được công bố。
  # Chỉ cần kiểm tra: để CI Trở về main Cụ thể, các cuộc họp sẽ được thực hiện tại địa phương. Ubuntu Không có Microsoft Black，og.png Không đúng。
  stats:
    name: Kiểm tra số liệu thống kê
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: HTML ngoại tuyến một tệp
        run: node tools/offline/build.mjs

      - name: Cài pandoc, typst và phông chữ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: |
          typst fonts | grep -i -E 'noto (serif|sans) cjk' || echo 'Không tìm thấy Noto CJK; PDF sẽ dùng phông dự phòng. Kiểm tra bước cài phông.'
          node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html

      - name: Phát hành vào Release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Commit ${GITHUB_SHA::7}, tạo lúc $(date -u -d '+7 hours' +'%Y-%m-%d %H:%M') (giờ Việt Nam). EPUB, PDF và HTML ngoại tuyến được tạo lại tự động sau mỗi lần cập nhật; liên kết tải không đổi."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Sách điện tử (EPUB / PDF / HTML ngoại tuyến, cập nhật tự động)" --notes "$notes"
          else
            gh release create epub-latest --title "Sách điện tử (EPUB / PDF / HTML ngoại tuyến, cập nhật tự động)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html --clobber
